version: '1.0'
name: xsnet-ci
displayName: XS-NET CI

variables:
  global:
    - XSNET_WIKI_TOKEN

triggers:
  trigger: auto
  push:
    branches:
      precise:
        - master
        - main

stages:
  - name: sync_wiki
    displayName: 同步 OpenWiki 到 Gitee Wiki
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@maven
        name: publish_openwiki
        displayName: 发布 openwiki 文档
        jdkVersion: '17'
        mavenVersion: 3.6.3
        commands:
          - |
            set -eu
            source_workspace="$PWD"
            rm -rf /tmp/xs-net-wiki
            git clone "https://gitee.com/xs-gitee-2023/xs-net.wiki.git" /tmp/xs-net-wiki
            find /tmp/xs-net-wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -R openwiki/. /tmp/xs-net-wiki/
            cd /tmp/xs-net-wiki
            git config user.name "gitee-ci"
            git config user.email "gitee-ci@users.noreply.gitee.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "docs: sync openwiki from xs-net ${GITEE_COMMIT:-unknown}"
              wiki_auth_header="$(git -C "$source_workspace" config --get http.https://gitee.com/.extraheader || true)"
              if [ -n "$wiki_auth_header" ]; then
                git -c "http.https://gitee.com/.extraheader=$wiki_auth_header" push origin HEAD
              else
                test -n "${XSNET_WIKI_TOKEN:-}" || { echo "Gitee checkout credentials unavailable; set XSNET_WIKI_TOKEN"; exit 1; }
                git push "https://oauth2:${XSNET_WIKI_TOKEN}@gitee.com/xs-gitee-2023/xs-net.wiki.git" HEAD
              fi
            fi