global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway-1:8080, gateway-2:8080]

  - job_name: login
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [login:8081]

  - job_name: logic
    metrics_path: /metrics
    static_configs:
      - targets: [logic-1:9090, logic-2:9090]
