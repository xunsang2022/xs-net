spring:
  application:
    name: game-db
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamedb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s

game:
  db:
    bgsave-seconds: ${GAME_DB_BGSAVE_SECONDS:3}
    log-batch-size: ${GAME_DB_LOG_BATCH_SIZE:100}
    log-poll-ms: ${GAME_DB_LOG_POLL_MS:1000}
    flush-concurrency: ${GAME_DB_FLUSH_CONCURRENCY:4}
    backfill:
      enabled: ${GAME_DB_BACKFILL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: game-db

logging:
  level:
    root: INFO
    com.game: INFO
    akka: INFO
