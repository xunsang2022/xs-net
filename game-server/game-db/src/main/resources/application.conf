akka {
  actor {
    provider = "cluster"
  }

  remote {
    artery {
      enabled = on
      transport = "aeron-udp"

      aeron {
        dir = "/target/aeron-ipc-db"
        media-driver = "embedded"
        socket {
          so-sndbuf = 2097152
          so-rcvbuf = 2097152
        }
      }

      canonical {
        hostname = "127.0.0.1"
        port = 5001
      }
    }
  }

  cluster {
    seed-nodes = [
      "akka://game-system@127.0.0.1:2001",
      "akka://game-system@127.0.0.1:4001",
      "akka://game-system@127.0.0.1:5001"
    ]

    roles = ["db"]

    sharding {
      numberOfShards = 100
      remember-entities = off
      remember-entities-store = "ddata"
    }

    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
  }

  distributed-data {
    durable {
      store = "akka.cluster.distributed-data.DurableStore$None$"
    }
  }
}
