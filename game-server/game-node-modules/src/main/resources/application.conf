# Akka Configuration
# 游戏服务器集群配置文件，用于配置Akka Cluster和Cluster Sharding
#
# HOCON 说明：
#   - 默认值写死在 "默认行"；
#   - 下一行再用 `key = ${?ENV_VAR}` 覆盖。
#   禁止写成 `${ENV_VAR:default}`（冒号在 HOCON 里是 path token，会报 BadPath）。
#
# 支持的环境变量（与 application.yml / IDEA Run Configuration 对齐）：
#   - AKKA_HOSTNAME   覆盖 canonical.hostname
#   - AKKA_PORT       覆盖 canonical.port
akka {
  actor {
    provider = "cluster"

    # 分片实体专用调度器：实体 Actor 会做阻塞式 Redis 访问，
    # 用大容量线程池覆盖并发阻塞实体；可通过 XS_ENTITY_POOL / XS_ENTITY_THROUGHPUT 覆盖。
    xs-entity-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 256
        fixed-pool-size = ${?XS_ENTITY_POOL}
      }
      throughput = 1
      throughput = ${?XS_ENTITY_THROUGHPUT}
    }
  }

  # 远程通信配置
  remote {
    # Artery远程传输配置
    artery {
      # 启用Artery远程传输
      enabled = on
      # 使用Aeron UDP作为传输协议，提供高性能低延迟通信
      transport = "aeron-udp"

      # Aeron媒体驱动配置
      aeron {
        # Aeron工作目录，用于存储Aeron相关数据
        dir = "/target/aeron-ipc-logic"
        # 使用嵌入式媒体驱动模式，避免共享驱动的冲突问题
        media-driver = "embedded"
        # 套接字配置
        socket {
          # 发送缓冲区大小，设置为2MB
          so-sndbuf = 2097152
          # 接收缓冲区大小，设置为2MB
          so-rcvbuf = 2097152
        }
      }

      # 规范地址配置，用于集群节点标识（可通过环境变量 AKKA_HOSTNAME / AKKA_PORT 覆盖）
      canonical {
        # 节点主机名（默认单机，多机部署时用 AKKA_HOSTNAME 覆盖）
        hostname = "127.0.0.1"
        hostname = ${?AKKA_HOSTNAME}
        # 节点端口（logic 默认 4001；可通过环境变量或 -Dakka.remote.artery.canonical.port 覆盖）
        port = 4001
        port = ${?AKKA_PORT}
      }
    }
  }

  # 集群配置
  cluster {
    # 集群种子节点列表，新节点通过连接这些节点加入集群
    # 注意：只列出已实际部署的节点（不要包含未部署的 db@5001 等占位端口，否则每 20s 产生 HandshakeTimeout WARN）
    seed-nodes = [
        # gateway（推荐作为集群稳定的第一个 bootstrap seed，始终排在最前）
        "akka://game-system@127.0.0.1:2001",
        # logic
        "akka://game-system@127.0.0.1:4001"
    ]

    # 为logic节点设置角色 这里通过jvm 参数配置
    roles = ["logic", "system"]

    # 集群分片配置，用于分布式管理PlayerActor
    sharding {
      # 分片数量，建议根据预期节点数和并发量调整
      # 计算公式：numberOfShards = 10 * 预期节点数
      numberOfShards = 100
      # 启用实体记忆功能，重启后自动恢复Actor状态
      remember-entities = off
      # 使用ddata存储实体位置信息，这是Akka支持的标准配置
      remember-entities-store = "ddata"
    }

  }

  # 分布式数据配置
  distributed-data {
    # 禁用持久化存储，使用内存存储
    durable {
      store = "akka.cluster.distributed-data.DurableStore$None$"
    }
  }
}
