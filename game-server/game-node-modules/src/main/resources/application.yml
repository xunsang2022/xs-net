# Plain configuration keys for the non-Boot startup flow.
# GameLogicApplication loads this file via SnakeYAML first; system properties
# Database and Redis settings are loaded from this file only.
game:
  redis:
    host: 172.21.255.41
    port: 6379
    password: "123456"
    database: 10
  storage:
    sync-interval-ms: 1000
  io:
    redis-threads: 16
    db-threads: 8
  logging:
    level: INFO
  management:
    config-reload-interval-ms: 1000
    token: ""
    arthas:
      home: ""
      telnet-port: 36581
    metrics:
      host: 127.0.0.1
      port: 9090
  db:
    url: jdbc:postgresql://172.21.255.41:5432/gamedb
    username: root
    password: ""
    batch-size: 100
    bgsave-seconds: 3
    flush-concurrency: 8
    connection-timeout-ms: 5000
    max-pool-size: 50
    min-idle: 2
  pekko:
    hostname: 127.0.0.1
    port: 4001
