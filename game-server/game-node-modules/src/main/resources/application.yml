# Plain configuration keys for the non-Boot startup flow.
# GameLogicApplication loads this file via SnakeYAML first; system properties
# and environment variables can still override (System.getProperty > env > yml > default).
game:
  redis:
    host: localhost
    port: 6379
    password: ""
    database: 0
  storage:
    sync-interval-ms: 1000
  battle:
    executor:
      pool-size: 8
      control-queue-capacity: 256
      max-inputs-per-drain: 512
      shutdown-timeout-ms: 2000
    tick-hz: 60
  io:
    redis-threads: 16
    db-threads: 8
  logging:
    level: INFO
  management:
    config-reload-interval-ms: 1000
    token: ""
    arthas:
      home: ""
      telnet-port: 36581
    metrics:
      host: 127.0.0.1
      port: 9090
  db:
    url: jdbc:postgresql://localhost:5432/gamedb
    username: root
    password: ""
    batch-size: 100
    bgsave-seconds: 3
    flush-concurrency: 8
    connection-timeout-ms: 5000
    max-pool-size: 50
    min-idle: 2
  pekko:
    hostname: 127.0.0.1
    port: 4001
