# Spring Boot configuration for the game logic process.
spring:
  main:
    web-application-type: none
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 64
          max-idle: 64
          min-idle: 4
      password: 123456
  datasource:
    url: jdbc:postgresql://localhost:5432/gamedb
    username: root
    password: ""
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: -1
      maximum-pool-size: 64
      minimum-idle: 2
logging:
  level:
    root: INFO
game:
  framework:
    actor-base-packages:
      - com.game.logic.actor
      - com.game.message.actor.logic
      - com.game.message.actor
    message-base-packages:
      - com.game.message.actor.logic
      - com.game.message.actor
  io:
    redis-threads: 16
    db-threads: 8
    queue-capacity: 8192
  db:
    batch-size: 100
    bgsave-seconds: 3
    flush-concurrency: 8
    log-poll-ms: 1000
  logging:
    level: INFO
  management:
    config-reload-interval-ms: 1000
    token: ""
    arthas:
      home: ""
      telnet-port: 36581
    metrics:
      host: 127.0.0.1
      port: 9090
