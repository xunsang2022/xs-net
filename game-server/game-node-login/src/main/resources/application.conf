# Akka Configuration
# 游戏服务器集群配置文件，用于配置Akka Cluster和Cluster Sharding
akka {
  actor {
    provider = "cluster"
  }

  # 远程通信配置
  remote {
    # Artery远程传输配置
    artery {
      # 启用Artery远程传输
      enabled = on
      # 使用Aeron UDP作为传输协议，提供高性能低延迟通信
      transport = "aeron-udp"

      # Aeron媒体驱动配置
      aeron {
        # Aeron工作目录，用于存储Aeron相关数据
        dir = "/target/aeron-ipc-logic"
        # 使用嵌入式媒体驱动模式，避免共享驱动的冲突问题
        media-driver = "embedded"
        # 套接字配置
        socket {
          # 发送缓冲区大小，设置为2MB
          so-sndbuf = 2097152
          # 接收缓冲区大小，设置为2MB
          so-rcvbuf = 2097152
        }
      }

      # 规范地址配置，用于集群节点标识
      canonical {
        # 节点主机名
        hostname = "127.0.0.1"
        # 节点端口，默认2552，可通过命令行参数-Dakka.remote.artery.canonical.port覆盖
        port = 3001
      }
    }
  }

  # 集群配置
  cluster {
    # 集群种子节点列表，新节点通过连接这些节点加入集群
    seed-nodes = [
        # gateway
        "akka://game-system@127.0.0.1:2001"
        # login
        "akka://game-system@127.0.0.1:3001",
        # logic
        "akka://game-system@127.0.0.1:4001"
    ]


    # 为logic节点设置角色 这里通过jvm 参数配置
    roles = ["login"]

    # 集群分片配置，用于分布式管理PlayerActor
    sharding {
      # 分片数量，建议根据预期节点数和并发量调整
      # 计算公式：numberOfShards = 10 * 预期节点数
      numberOfShards = 100
      # 启用实体记忆功能，重启后自动恢复Actor状态
      remember-entities = off
      # 使用ddata存储实体位置信息，这是Akka支持的标准配置
      remember-entities-store = "ddata"
    }

    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
  }

  # 分布式数据配置
  distributed-data {
    # 禁用持久化存储，使用内存存储
    durable {
      store = "akka.cluster.distributed-data.DurableStore$None$"
    }
  }
}