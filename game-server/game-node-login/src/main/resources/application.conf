# Apache Pekko Configuration
# Login 节点 Pekko 集群配置文件
#
# HOCON 说明：
#   - 默认值写死在 "默认行"；
#   - 下一行再用 `key = ${?ENV_VAR}` 覆盖。
#
# 支持的环境变量：
#   - PEKKO_HOSTNAME  覆盖 canonical.hostname
#   - PEKKO_PORT      覆盖 canonical.port
pekko {
  actor {
    provider = "cluster"
  }

  # 远程通信配置
  remote {
    # Artery远程传输配置
    artery {
      # 启用Artery远程传输
      enabled = on
      # 使用Aeron UDP作为传输协议
      transport = "aeron-udp"

      # Aeron媒体驱动配置
      aeron {
        # Aeron工作目录
        dir = "/target/aeron-ipc-login"
        # 使用嵌入式媒体驱动模式
        media-driver = "embedded"
        # 套接字配置
        socket {
          # 发送缓冲区大小，设置为2MB
          so-sndbuf = 2097152
          # 接收缓冲区大小，设置为2MB
          so-rcvbuf = 2097152
        }
      }

      # 规范地址配置（可通过环境变量 PEKKO_HOSTNAME / PEKKO_PORT 覆盖）
      canonical {
        # 节点主机名（默认单机，多机部署时用 PEKKO_HOSTNAME 覆盖）
        hostname = "127.0.0.1"
        hostname = ${?PEKKO_HOSTNAME}
        # 节点端口（login 默认 3001；可通过环境变量覆盖）
        port = 3001
        port = ${?PEKKO_PORT}
      }

      # 低延迟关键：降低 embedded 媒体驱动空闲 CPU 级
      advanced {
        embedded-media-driver {
          idle-cpu-level = 3
          idle-cpu-level = ${?PEKKO_IDLE_CPU_LEVEL}
        }
      }
    }
  }

  # 集群配置
  cluster {
    # 集群种子节点列表
    seed-nodes = [
        # gateway（推荐作为集群稳定的第一个 bootstrap seed，始终排在最前）
        "pekko://game-system@127.0.0.1:2001",
        # logic
        "pekko://game-system@127.0.0.1:4001"
    ]

    # 为login节点设置角色
    roles = ["login"]

    # 集群分片配置
    sharding {
      # 分片数量
      numberOfShards = 100
      # 禁用实体记忆功能（login节点不需要）
      remember-entities = off
      # 使用ddata存储实体位置信息
      remember-entities-store = "ddata"
    }
  }

  # 分布式数据配置
  distributed-data {
    # 禁用持久化存储，使用内存存储
    durable {
      store = "org.apache.pekko.cluster.ddata.DurableStore$None$"
    }
  }
}
