spring:
  autoconfigure:
    exclude: com.xs.core.config.GameFrameworkAutoConfiguration

server:
  port: 8081

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Logging Configuration
logging:
  level:
    root: INFO

# JWT Configuration
# 生产环境必须通过环境变量 JWT_SECRET 注入；未设置时回退到下面的本地开发默认值，
# 该默认值仅用于本地调试，切勿在生产使用
jwt:
  secret: "${JWT_SECRET:xs-net-local-dev-only-secret-key-32bytes}"
  expiration: 86400000