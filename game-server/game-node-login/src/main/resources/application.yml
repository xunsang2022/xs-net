spring:
  autoconfigure:
    exclude: com.xs.core.config.GameFrameworkAutoConfiguration

server:
  port: 8081

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: INFO

# JWT Configuration
jwt:
  secret: xs-net-dev-jwt-secret-key-32bytes-minimum!!
  expiration: 86400000