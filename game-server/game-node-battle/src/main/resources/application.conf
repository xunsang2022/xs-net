pekko {
  actor {
    provider = "cluster"

    xs-entity-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 16
        fixed-pool-size = ${?BATTLE_ACTOR_POOL}
      }
      throughput = 1
    }

    battle-control-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 4
        fixed-pool-size = ${?BATTLE_CONTROL_ACTOR_POOL}
      }
      throughput = 1
    }
  }

  remote.artery {
    enabled = on
    transport = "aeron-udp"
    aeron {
      dir = "/target/aeron-ipc-battle"
      media-driver = "embedded"
      socket {
        so-sndbuf = 2097152
        so-rcvbuf = 2097152
      }
    }
    canonical {
      hostname = "127.0.0.1"
      hostname = ${?BATTLE_PEKKO_HOSTNAME}
      hostname = ${?PEKKO_HOSTNAME}
      port = 4501
      port = ${?BATTLE_PEKKO_PORT}
      port = ${?PEKKO_PORT}
    }
  }

  cluster {
    seed-nodes = [
      "pekko://game-system@127.0.0.1:2001",
      "pekko://game-system@127.0.0.1:4001"
    ]
    roles = ["battle", "system"]
    sharding {
      numberOfShards = 100
      remember-entities = off
      remember-entities-store = "ddata"
    }
  }

  distributed-data.durable.store = "org.apache.pekko.cluster.ddata.DurableStore$None$"
}
