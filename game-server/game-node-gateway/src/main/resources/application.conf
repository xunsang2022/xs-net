# Akka Configuration
# 游戏服务器集群配置文件，用于配置Akka Cluster和Cluster Sharding
akka {
  actor {
    provider = "cluster"
  }

  # 远程通信配置
  remote {
    # Artery远程传输配置
    artery {
      # 启用Artery远程传输
      enabled = on
      # 使用Aeron UDP作为传输协议，提供高性能低延迟通信
      transport = "aeron-udp"

      # 规范地址配置，用于集群节点标识
      canonical {
        # 节点主机名
        hostname = "127.0.0.1"
        # 节点端口，默认2552，可通过命令行参数-Dakka.remote.artery.canonical.port覆盖
        port = 2001
      }
    }
  }

  # 集群配置
  cluster {
    # 集群种子节点列表，新节点通过连接这些节点加入集群
    seed-nodes = [
        # gateway
        "akka://game-system@127.0.0.1:2001"
        # login
        "akka://game-system@127.0.0.1:3001",
        # logic
        "akka://game-system@127.0.0.1:4001"
    ]


    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"

    roles = ["gateway"]
  }
}
