# Akka Configuration
# 游戏服务器集群配置文件，用于配置Akka Cluster和Cluster Sharding
#
# HOCON 说明：
#   - 默认值写死在 "默认行"；
#   - 下一行再用 `key = ${?ENV_VAR}` 覆盖。
#   禁止写成 `${ENV_VAR:default}`（冒号在 HOCON 里是 path token，会报 BadPath）。
#
# 支持的环境变量（与 application.yml / IDEA Run Configuration 对齐）：
#   - AKKA_HOSTNAME   覆盖 canonical.hostname
#   - AKKA_PORT       覆盖 canonical.port
akka {
  actor {
    provider = "cluster"
  }

  # 远程通信配置
  remote {
    # Artery远程传输配置
    artery {
      # 启用Artery远程传输
      enabled = on
      # 使用Aeron UDP作为传输协议，提供高性能低延迟通信
      transport = "aeron-udp"

      # 规范地址配置，用于集群节点标识（可通过环境变量 AKKA_HOSTNAME / AKKA_PORT 覆盖）
      canonical {
        # 节点主机名（默认单机，多机部署时用 AKKA_HOSTNAME 覆盖）
        hostname = "127.0.0.1"
        hostname = ${?AKKA_HOSTNAME}
        # 节点端口（gateway 默认 2001；可通过环境变量或 -Dakka.remote.artery.canonical.port 覆盖）
        port = 2001
        port = ${?AKKA_PORT}
      }
    }
  }

  # 集群配置
  cluster {
    # 集群种子节点列表，新节点通过连接这些节点加入集群
    # 注意：只列出已实际部署的节点（不要包含未部署的 db@5001 等占位端口，否则每 20s 产生 HandshakeTimeout WARN）
    seed-nodes = [
        "akka://game-system@127.0.0.1:2001",
        "akka://game-system@127.0.0.1:4001"
    ]

    roles = ["gateway"]
  }
}
