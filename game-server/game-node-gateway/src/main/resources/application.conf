# Apache Pekko Configuration
# 游戏服务器集群配置文件，用于配置Pekko Cluster和Cluster Sharding
#
# HOCON 说明：
#   - 默认值写死在 "默认行"；
#   - 下一行再用 `key = ${?ENV_VAR}` 覆盖。
#   禁止写成 `${ENV_VAR:default}`（冒号在 HOCON 里是 path token，会报 BadPath）。
#
# 支持的环境变量（与 application.yml / IDEA Run Configuration 对齐）：
#   - PEKKO_HOSTNAME  覆盖 canonical.hostname
#   - PEKKO_PORT      覆盖 canonical.port
pekko {
  actor {
    provider = "cluster"

    # 分片实体专用调度器：实体 Actor 会做阻塞式 Redis 访问，
    # 用大容量线程池覆盖并发阻塞实体；可通过 XS_ENTITY_POOL / XS_ENTITY_THROUGHPUT 覆盖。
    xs-entity-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 256
        fixed-pool-size = ${?XS_ENTITY_POOL}
      }
      throughput = 1
      throughput = ${?XS_ENTITY_THROUGHPUT}
    }
  }

  # 远程通信配置
  remote {
    # Artery远程传输配置
    artery {
      # 启用Artery远程传输
      enabled = on
      # 使用Aeron UDP作为传输协议，提供高性能低延迟通信
      transport = "aeron-udp"

      # 规范地址配置，用于集群节点标识（可通过环境变量 PEKKO_HOSTNAME / PEKKO_PORT 覆盖）
      canonical {
        # 节点主机名（默认单机，多机部署时用 PEKKO_HOSTNAME 覆盖）
        hostname = "127.0.0.1"
        hostname = ${?PEKKO_HOSTNAME}
        # 节点端口（gateway 默认 2001；可通过环境变量或 -Dpekko.remote.artery.canonical.port 覆盖）
        port = 2001
        port = ${?PEKKO_PORT}
      }

      # 低延迟关键：降低 embedded 媒体驱动空闲 CPU 级（默认 8），低并发请求时避免 ~10ms 级空闲唤醒时延。
      advanced {
        embedded-media-driver {
          idle-cpu-level = 3
          idle-cpu-level = ${?PEKKO_IDLE_CPU_LEVEL}
        }
      }
    }
  }

  # 集群配置
  cluster {
    # 集群种子节点列表，新节点通过连接这些节点加入集群
    # 注意：只列出已实际部署的节点（不要包含未部署的 db@5001 等占位端口，否则每 20s 产生 HandshakeTimeout WARN）
    seed-nodes = [
        "pekko://game-system@127.0.0.1:2001",
        "pekko://game-system@127.0.0.1:4001"
    ]

    roles = ["gateway"]

    # ---- 生产部署注意（多网关实例）----
    # 1. 每个网关实例用 PEKKO_PORT 分配不同端口，PEKKO_HOSTNAME 指向各自网卡。
    # 2. 多实例接入时，enable Split Brain Resolver 并配置合理策略，避免网络分区误判 Down
    #    （本地双节点开发保持不变，不要开启，见项目约束）。
    # 3. 优雅下线：先向外层摘除该实例（负载均衡移除），等待存量连接处理完后再停止进程，
    #    避免重连风暴；Pekko 侧依靠 Cluster Sharding 自动 rebalance。
    # 4. 活动探活：通过 actuator /actuator/health/liveness 与 /actuator/health/readiness
    #    接入 k8s/监控，区分存活与就绪。
  }
}
