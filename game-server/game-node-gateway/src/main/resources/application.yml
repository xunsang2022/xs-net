# Spring Boot Server Configuration
server:
  port: 8080

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    com.game: INFO
    akka: INFO

# Auth proxy configuration
game:
  auth:
    login-base-url: ${LOGIN_BASE_URL:http://127.0.0.1:8081}
    verify-mode: ${AUTH_VERIFY_MODE:local}
    verify-timeout-ms: ${AUTH_VERIFY_TIMEOUT_MS:2000}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
