# Spring Boot Server Configuration
server:
  port: 8080

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    com.game: INFO
    akka: INFO

# Auth proxy configuration
game:
  framework:
    actor-auto-register-enabled: true
    message-auto-register-enabled: true
    actor-base-packages:
      - com.game.gateway.actor
      - com.game.message.actor
    message-base-packages:
      - com.game.message.actor
  auth:
    login-base-url: http://127.0.0.1:8081
    verify-mode: local
    verify-timeout-ms: 2000
  netty:
    port: 8082

# JWT Configuration
jwt:
  secret: xs-net-dev-jwt-secret-key-32bytes-minimum!!
  expiration: 86400000