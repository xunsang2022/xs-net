syntax = "proto3";

package game.message;

option java_multiple_files = true;
option java_package = "com.game.protocol.pb";

// CS_Logout = 1001
message CS_Logout {
  optional string player_id = 1;
  optional string session_id = 2;
}

// PlayerEnterCommand = 3003
message PlayerEnterCommand {
  optional int64 player_id = 1;
  optional string player_name = 2;
  optional string channel_id = 3;
}

// GmKickPlayerCommand = 3005
message GmKickPlayerCommand {
  optional string request_id = 1;
  optional string operator = 2;
  optional string reason = 3;
  optional int64 issued_at = 4;
}

// PlayerSceneChanged = 3008
message PlayerSceneChanged {
  optional string scene_id = 1;
  optional bool joined = 2;
}
