syntax = "proto3";

package game.message;

option java_multiple_files = true;
option java_package = "com.game.protocol.pb";

// LogRecordCommand = 999
message LogRecordCommand {
  optional int32 level = 1;
  optional int32 type = 2;
  optional string message = 3;
  optional int64 player_id = 4;
}

// CS_LogReport = 2100
message CS_LogReport {
  optional string session_id = 1;
  optional int32 log_level = 2;
  optional int32 log_type = 3;
  optional string content = 4;
}

// SC_LogReport = 2101
message SC_LogReport {
  optional string session_id = 1;
  optional int32 result = 2;
  optional int64 log_id = 3;
}
